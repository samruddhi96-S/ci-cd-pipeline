name: CI

# Jab bhi code push ho ya pull request bane, ye pipeline apne aap chalegi
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: Python setup karo
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Libraries install karo
        run: pip install -r requirements-dev.txt

      - name: Lint check (code style)
        run: ruff check .

      - name: Tests chalao + coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Coverage report save karo
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Security tools install karo
        run: pip install -r requirements-dev.txt
      - name: Unsafe code check (bandit)
        run: bandit -r app
      - name: Vulnerable libraries check (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Docker image build karo
        run: docker build -t cicd-starter .
      - name: Container chala ke health check karo
        run: |
          docker run -d -p 5000:5000 --name app cicd-starter
          sleep 5
          curl --fail http://localhost:5000/health
